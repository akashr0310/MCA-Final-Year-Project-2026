<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybersecurity IDS</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

{% if session.get("user_id") %}
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('dashboard') }}">
            Cybersecurity IDS
        </a>
        <div>
            <a class="btn btn-sm btn-outline-light me-2"
               href="{{ url_for('dashboard') }}">Dashboard</a>
            <a class="btn btn-sm btn-outline-light me-2"
               href="{{ url_for('prediction') }}">Prediction</a>
            <a class="btn btn-sm btn-outline-light me-2"
               href="{{ url_for('monitoring') }}">Monitoring</a>
            <a class="btn btn-sm btn-outline-light me-2"
               href="{{ url_for('history') }}">History</a>
            <a class="btn btn-sm btn-outline-light me-2"
               href="{{ url_for('alerts') }}">Alerts</a>
            <a class="btn btn-sm btn-danger"
               href="{{ url_for('logout') }}">Logout</a>
        </div>
    </div>
</nav>
{% endif %}

<div class="container mt-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
</div>

</body>
</html>
