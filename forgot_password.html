<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Cybersecurity IDS</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #031b33,
                #0b5fa5
            );

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        .card {
            width: 430px;
            background: white;
            border-radius: 18px;
            padding: 45px;
            box-shadow:
                0 20px 60px rgba(0,0,0,0.25);
        }


        .icon {
            text-align: center;
            font-size: 50px;
        }


        h1 {
            text-align: center;
            color: #14213d;
            margin-bottom: 10px;
        }


        .subtitle {
            text-align: center;
            color: #6b7c93;
            margin-bottom: 30px;
            line-height: 1.5;
        }


        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }


        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d5dfeb;
            border-radius: 9px;
            font-size: 16px;
            margin-bottom: 20px;
        }


        input:focus {
            outline: none;
            border-color: #1677ff;
            box-shadow:
                0 0 0 3px rgba(22,119,255,0.12);
        }


        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: #1677ff;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }


        button:hover {
            background: #0868e8;
        }


        .back {
            text-align: center;
            margin-top: 25px;
        }


        .back a {
            color: #1677ff;
            font-weight: bold;
            text-decoration: none;
        }


        .error {
            background: #ffe5e5;
            color: #b42318;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

    </style>

</head>


<body>

<div class="card">

    <div class="icon">
        🔐
    </div>

    <h1>
        Forgot Password?
    </h1>

    <p class="subtitle">
        Enter your registered email address
        to reset your Cybersecurity IDS password.
    </p>


    {% if error %}

    <div class="error">
        {{ error }}
    </div>

    {% endif %}


    <form method="POST">

        <label for="email">
            Registered Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >


        <button type="submit">
            Continue
        </button>

    </form>


    <div class="back">

        <a href="{{ url_for('login') }}">
            ← Back to Login
        </a>

    </div>

</div>

</body>

</html>
