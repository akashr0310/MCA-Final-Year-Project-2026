<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password - Cybersecurity IDS</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #031b33,
                #0b5fa5
            );

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        .card {
            width: 430px;

            background: white;

            border-radius: 18px;

            padding: 45px;

            box-shadow:
                0 20px 60px rgba(0,0,0,0.25);
        }


        .icon {
            text-align: center;
            font-size: 50px;
        }


        h1 {
            text-align: center;
            color: #14213d;
        }


        .subtitle {
            text-align: center;
            color: #6b7c93;
            margin-bottom: 30px;
        }


        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }


        input {
            width: 100%;
            padding: 14px;

            border: 1px solid #d5dfeb;

            border-radius: 9px;

            font-size: 16px;

            margin-bottom: 20px;
        }


        button {
            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 9px;

            background: #1677ff;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }


        button:hover {
            background: #0868e8;
        }


        .error {
            background: #ffe5e5;

            color: #b42318;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 20px;

            text-align: center;
        }

    </style>

</head>


<body>

<div class="card">

    <div class="icon">
        🔑
    </div>

    <h1>
        Reset Password
    </h1>

    <p class="subtitle">
        Create a new password for your account.
    </p>


    {% if error %}

    <div class="error">
        {{ error }}
    </div>

    {% endif %}


    <form method="POST">

        <label>
            New Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Enter new password"
            minlength="6"
            required
        >


        <label>
            Confirm Password
        </label>

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm new password"
            minlength="6"
            required
        >


        <button type="submit">
            Reset Password
        </button>

    </form>

</div>

</body>

</html>
